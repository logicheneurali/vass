[gui.bot_howto]
type = note
note_it = COME CONFIGURARE IL BOT TELEGRAM (fai questo una sola volta):
 1) Crea il bot (da telefono o da PC, su Telegram):
    - Cerca "@BotFather" nella barra di ricerca di Telegram e aprilo
    - Premi "Avvia" (o invia /start)
    - Invia il comando:  /newbot
    - BotFather ti chiede un NOME per il bot: scrivine uno, es. "VASS Remote"
    - Poi ti chiede uno USERNAME: deve finire con "bot", es. "vass_remote_bot"
    - Se lo username è libero, BotFather risponde "Done!" e mostra il TOKEN,
      un codice tipo: 123456789:AAEeXxYyZz...
 2) Copia il token (doppio clic, Ctrl+C) e incollalo nel campo "Token del bot"
    qui sotto (Ctrl+V), poi premi "Salva". Il token è come una password: non condividerlo.
 3) Manda un messaggio al bot:
    - Apri la chat con il tuo nuovo bot (cercalo per username) e premi "Avvia"
    - Scrivi un messaggio qualunque (es. "ciao")
    - Il bot ti risponde mostrandoti il tuo CHAT ID, un numero tipo 123456789
 4) Autorizza la chat:
    - Copia quel numero e incollalo nel campo "Chat id autorizzati", poi "Salva"
    - Da questo momento solo TU (e i numeri che aggiungi, separati da virgola)
      puoi usare il bot
 5) (Consigliato) Imposta un PIN di 6 cifre nel campo "PIN": ogni 24 ore il bot
    chiederà il PIN prima di eseguire le richieste; dopo 3 PIN sbagliati si
    blocca per 10 minuti.
 6) Fatto! Scrivi richieste al bot (es. "quali sono le notizie di oggi?") e VASS
    le esegue come se le avessi dette a voce. Il comando /stato mostra lo stato.
    I valori salvati vengono applicati entro pochi secondi, senza riavviare VASS.
note = HOW TO SET UP THE TELEGRAM BOT (do this once):
 1) Create the bot (on Telegram, phone or PC):
    - Search for "@BotFather" in the Telegram search bar and open it
    - Press "Start" (or send /start)
    - Send the command:  /newbot
    - BotFather asks for a NAME for the bot: pick one, e.g. "VASS Remote"
    - Then it asks for a USERNAME: it must end with "bot", e.g. "vass_remote_bot"
    - If the username is free, BotFather replies "Done!" and shows the TOKEN, e.g.:
      123456789:AAEeXxYyZz...
 2) Copy the token, paste it in the "Bot token" field below and press "Save".
    Treat the token like a password: never share it.
 3) Message your bot:
    - Open the chat with your new bot (search by username) and press "Start"
    - Send any message (e.g. "hi")
    - The bot replies with your CHAT ID, a number like 123456789
 4) Authorize the chat:
    - Copy that number into the "Allowed chat ids" field and press "Save"
    - From now on only you (and any ids you add, comma-separated) can use the bot
 5) (Recommended) Set a 6-digit PIN in the "PIN" field: every 24 hours the bot
    asks for the PIN before running requests; 3 wrong PINs block it for 10 minutes.
 6) Done! Send requests to the bot (e.g. "what are today's news?") and VASS runs
    them as if spoken aloud. /stato shows VASS status.
    Saved values apply within seconds, no restart needed.

