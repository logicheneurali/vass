[server]
enabled = true
llama_server_path = /usr/bin
llama_server_working_directory = /home/username/vass
llama_server_arguments = -nr -b 2048 --cache-type-k q4_0 --cache-type-v q4_0 --offline -ncmoe 15 --prio 2 -rea off --load-mode none -t 8 --models-max 2 --flash-attn on --cpu-moe --cache-ram 1024 --rope-freq-base 500000 --rope-freq-scale 0.5 --cont-batching --cache_reuse 256 --ubatch-size 1024 --parallel 1 --ctx-size 80000 -ngl 27 --models-dir /home/effedi/Scaricati
llama_autostart = true
model_auto_select = true
port = 8080

[health]
poll_interval = 10
ready_timeout = 60
max_restarts = 3
restart_cooldown = 30

[gui.llama_server_path]
type = text
section = server
label_it = Percorso di llama-server
label = Server path

[gui.llama_server_working_directory]
type = text
section = server
label_it = Directory di lavoro
label = Working directory

[gui.llama_server_arguments]
type = text
section = server
label_it = Argomenti avanzati
label = Advanced arguments

[gui.llama_autostart]
type = toggle
section = server
label_it = Avvia automaticamente il server
label = Start server automatically

[gui.poll_interval]
type = slider
min_value = 2
max_value = 120
step = 1
decimals = 0
label_it = Polling interval (seconds)
label = Polling interval (seconds)
section = health

[gui.ready_timeout]
type = slider
min_value = 10
max_value = 300
step = 1
decimals = 0
label_it = Ready timeout (seconds)
label = Ready timeout (seconds)
section = health

[gui.max_restarts]
type = slider
min_value = 1
max_value = 20
step = 1
decimals = 0
label_it = Maximum restarts
label = Maximum restarts
section = health

[gui.restart_cooldown]
type = slider
min_value = 5
max_value = 300
step = 1
decimals = 0
label_it = Restart cooldown (seconds)
label = Restart cooldown (seconds)
section = health

