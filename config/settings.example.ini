[locale]
language = en

[gui]
lastmode = c
x = 1541
y = 52
width = 200
height = 32
font_family = Segoe UI
font_size = 10

[wakeword]
wakeword = erika
sensitivity = 0.005

[commands]
similarity = 0.6
word_learning_enabled = false

[tts]
tts_engine = kokoro
volume = 0.50

[ai]
url = http://127.0.0.1:8080/v1
model = Qwen3-8B-Q4_K_M
system_message = You are a cheerful voice assistant. Always respond in English concisely, avoiding complex formatting. Plain text only, no emojis, no HTML, no markdown.
mcp_server_url = http://localhost:9988
memory_tokens = 4000
blacklist = Amara.org,QTTS
allow_ai_scripts = false
context_length = 0
compress_context = false
overflow_strategy = truncate

[llamacpp]
llama_server_path = C:\path\to\llamacpp
llama_server_working_directory = 
llama_server_arguments = --models-dir .\models -b 4096 --cache-type-k q8_0 --cache-type-v q8_0 --offline --prio 2 -rea off -ngl -1 --no-mmap -t 12 --models-max 1 --flash-attn on --cache-ram 4096 -c 10240 --cont-batching --sleep-idle-seconds 600 --timeout 36000
llama_autostart = false

[resources]
cpu_max = 75
ram_max = 99
gpu_max = 75
vram_max = 99
resource_timeout = 10

[events]
reminder_advance = 3600
work_start_hour = 08:00
work_end_hour = 19:00
lunch_start = 13:00
lunch_end = 14:30


[audio]
input_device = -1
output_device = -1
input_volume = 1.0
output_volume = 1.0
