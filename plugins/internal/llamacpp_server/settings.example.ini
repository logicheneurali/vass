[server]
enabled = true
llama_server_path = 
llama_server_working_directory = 
llama_server_arguments = --ctx-size 4096 --threads 8 --threads-batch 8
llama_autostart = false
model_auto_select = true
port = 8080

[health]
poll_interval = 10
ready_timeout = 60
max_restarts = 3
restart_cooldown = 30

[gui.llama_server_path]
type = text
section = server
label_it = Path to llama-server
label = Server path

[gui.llama_server_working_directory]
type = text
section = server
label_it = Work directory
label = Working directory

[gui.llama_server_arguments]
type = text
section = server
label_it = Server arguments
label = Server arguments

[gui.llama_autostart]
type = toggle
section = server
label_it = Start server automatically
label = Autostart

[gui.poll_interval]
type = slider
min_value = 2
max_value = 120
step = 1
decimals = 0
label_it = Polling interval (seconds)
label = Polling interval (seconds)
section = health

[gui.ready_timeout]
type = slider
min_value = 10
max_value = 300
step = 1
decimals = 0
label_it = Ready timeout (seconds)
label = Ready timeout (seconds)
section = health

[gui.max_restarts]
type = slider
min_value = 1
max_value = 20
step = 1
decimals = 0
label_it = Maximum restarts
label = Maximum restarts
section = health

[gui.restart_cooldown]
type = slider
min_value = 5
max_value = 300
step = 1
decimals = 0
label_it = Restart cooldown (seconds)
label = Restart cooldown (seconds)
section = health
