[storage]
max_age_days = 30
max_events_per_day = 100

[schedule]
interval_min = 60
idle_seconds = 300
cpu_max = 50
ram_max = 80
gpu_max = 50
vram_max = 90

[rss]
rss_limit = 50

[wikipedia]
wikipedia_lang = en

[notify]
notify_significance = high

[summary]
finalize = on

[gui.finalize]
type = dropdown
options = on|off
label = Finalize past day summaries
label_it = Finalizza summary dei giorni passati
section = summary

[gui.max_age_days]
type = slider
min_value = 7
max_value = 3650
step = 1
decimals = 0
label = Keep events for (days)
label_it = Conserva eventi per (giorni)
section = storage

[gui.max_events_per_day]
type = slider
min_value = 10
max_value = 500
step = 10
decimals = 0
label = Max events per day
label_it = Max eventi al giorno
section = storage

[gui.interval_min]
type = slider
min_value = 5
max_value = 360
step = 5
decimals = 0
label = Check interval (minutes)
label_it = Intervallo controllo (minuti)
section = schedule

[gui.idle_seconds]
type = slider
min_value = 60
max_value = 1800
step = 30
decimals = 0
label = Idle threshold (seconds)
label_it = Soglia inattività (secondi)
section = schedule

[gui.cpu_max]
type = slider
min_value = 5
max_value = 100
step = 5
decimals = 0
label = Max CPU %
label_it = CPU massima %
section = schedule

[gui.ram_max]
type = slider
min_value = 10
max_value = 100
step = 5
decimals = 0
label = Max RAM %
label_it = RAM massima %
section = schedule

[gui.gpu_max]
type = slider
min_value = 5
max_value = 100
step = 5
decimals = 0
label = Max GPU %
label_it = GPU massima %
section = schedule

[gui.vram_max]
type = slider
min_value = 5
max_value = 100
step = 5
decimals = 0
label = Max VRAM %
label_it = VRAM massima %
section = schedule

[gui.rss_limit]
type = slider
min_value = 10
max_value = 200
step = 10
decimals = 0
label = Max RSS articles to analyze
label_it = Max articoli RSS da analizzare
section = rss

[gui.notify_significance]
type = dropdown
options = none|low|medium|high
label = Notify on significance
label_it = Notifica per importanza
section = notify

[gui.wikipedia_lang]
type = dropdown
options = en|it|de|fr|es|pt|ja|ko|zh
label = Wikipedia language
label_it = Lingua Wikipedia
section = wikipedia
