[locale]
language = it

[gui]
x = 1680
y = 1003
width = 200
height = 32
font_family = Segoe UI
font_size = 10

[wakeword]
wakeword = erika
sensitivity = 0.015

[commands]
similarity = 0.75

[tts]
tts_engine = kokoro
volume = 0.50

[ai]
url = http://127.0.0.1:8080/v1
model = Qwen3-8B-Q4_K_M
system_message = Sei un allegro assistente vocale. Rispondi sempre in italiano e in modo breve ma esaustivo, evitando formattazioni complesse. solo testo puro, nessun emoji o testo html o markdown.
mcp_server_url = http://localhost:9988
memory_tokens = 4000
blacklist = Amara.org,QTTS

[llamacpp]
llama_server_path = C:\path\to\llamacpp
llama_server_working_directory = 
llama_server_arguments = --models-dir .\models -b 4096 --cache-type-k q8_0 --cache-type-v q8_0 --offline --prio 2 -rea off -ngl -1 --no-mmap -t 12 --models-max 1 --flash-attn on --cache-ram 4096 -c 10240 --cont-batching --sleep-idle-seconds 600 --timeout 36000

[resources]
cpu_max = 75
ram_max = 99
gpu_max = 75
vram_max = 99
resource_timeout = 30

[events]
reminder_advance = 3600

