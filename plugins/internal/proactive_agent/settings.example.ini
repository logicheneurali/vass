[agent]
interval_min = 10
max_actions_per_day = 10
action_types = notify,say
notify_on_idle = true
prefix = Proactive
prefix_it = Agente
idle_seconds = 300
cpu_max = 70
ram_max = 70
gpu_max = 70
vram_max = 90
include_profile = false
include_history = true
include_rss = true
include_world_events = true

[gui.interval_min]
type = slider
label = Check interval (minutes)
label_it = Intervallo controllo (minuti)
min_value = 5
max_value = 360
step = 5
decimals = 0
section = agent

[gui.max_actions_per_day]
type = slider
label = Max actions per day
label_it = Massimo azioni al giorno
min_value = 1
max_value = 20
step = 1
decimals = 0
section = agent

[gui.notify_on_idle]
type = toggle
label = Speak only when idle
label_it = Parla solo se inattivo
section = agent

[gui.idle_seconds]
type = slider
label = Idle threshold (seconds)
label_it = Soglia inattività (secondi)
min_value = 60
max_value = 1800
step = 30
decimals = 0
section = agent

[gui.cpu_max]
type = slider
label = Max CPU %
label_it = CPU massima %
min_value = 5
max_value = 100
step = 5
decimals = 0
section = agent

[gui.ram_max]
type = slider
label = Max RAM %
label_it = RAM massima %
min_value = 10
max_value = 100
step = 5
decimals = 0
section = agent

[gui.gpu_max]
type = slider
label = Max GPU %
label_it = GPU massima %
min_value = 5
max_value = 100
step = 5
decimals = 0
section = agent

[gui.vram_max]
type = slider
label = Max VRAM %
label_it = VRAM massima %
min_value = 5
max_value = 100
step = 5
decimals = 0
section = agent

[gui.prefix]
type = text
label = Notification prefix
label_it = Prefisso notifiche
section = agent

[gui.include_profile]
type = toggle
label = Include profile in prompt
label_it = Includi profilo nel prompt
section = agent

[gui.include_history]
type = toggle
label = Include conversation history in prompt
label_it = Includi cronologia conversazioni nel prompt
section = agent

[gui.include_rss]
type = toggle
label = Include RSS articles in prompt
label_it = Includi articoli RSS nel prompt
section = agent

[gui.include_world_events]
type = toggle
label = Include world events in prompt
label_it = Includi eventi mondiali nel prompt
section = agent

